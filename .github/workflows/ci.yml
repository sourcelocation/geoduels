name: ci

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'extension/**'
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'extension/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Generate and test Go code
        working-directory: backend
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0 generate
          go test ./...
          go vet ./...

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('web/package-lock.json') }}-${{ hashFiles('web/**/*.[jt]s', 'web/**/*.[jt]sx', 'web/**/*.css') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('web/package-lock.json') }}-

      - name: Test and build
        working-directory: web
        env:
          NEXT_PUBLIC_APP_VERSION: ci
          NEXT_PUBLIC_GIT_SHA: ci
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: |
          npm ci --no-audit --no-fund
          npm run lint:architecture:strict
          npm run test
          npm run build

  # Checks the Dockerfiles and warms the cache that releases build from.
  # Production is amd64; arm64 images are built only on release.
  images:
    name: images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build images
        uses: docker/bake-action@v6
        env:
          PLATFORMS: linux/amd64
          CACHE_SCOPE: images-ubuntu-latest
          CACHE_READONLY: ${{ github.ref != 'refs/heads/master' }}
          TAG: ci
          APP_VERSION: ci
          GIT_SHA: ${{ github.sha }}
        with:
          files: docker-bake.hcl
          targets: default

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
