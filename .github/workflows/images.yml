name: images

# Catches a broken image build before a release does.
on:
  push:
    branches: [master]
    paths:
      - '**/Dockerfile'
      - '**/.dockerignore'
      - docker-bake.hcl
      - backend/go.mod
      - backend/go.sum
      - web/package-lock.json
      - .github/workflows/images.yml
  pull_request:
    paths:
      - '**/Dockerfile'
      - '**/.dockerignore'
      - docker-bake.hcl
      - backend/go.mod
      - backend/go.sum
      - web/package-lock.json
      - .github/workflows/images.yml

permissions:
  contents: read
  packages: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    name: images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Login to registry
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - uses: sourcelocation/.github/actions/bake@b17a6ef9109e71f8212ebd0017429a9eb57adb08 # main
        env:
          TAG: ci
          REVISION: ${{ github.sha }}
