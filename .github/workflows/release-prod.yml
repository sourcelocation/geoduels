name: release-prod

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: release-prod
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.REGISTRY != '' && vars.REGISTRY || format('ghcr.io/{0}', github.repository_owner) }}
  OPS_REPOSITORY: ${{ vars.OPS_REPOSITORY != '' && vars.OPS_REPOSITORY || 'sourcelocation/ops' }}

jobs:
  release-meta:
    name: release-meta
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.meta.outputs.release_sha }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          set -euo pipefail
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "release_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

  go-checks:
    name: go-checks
    runs-on: ubuntu-latest
    needs: release-meta
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-meta.outputs.release_sha }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Generate and test Go code
        working-directory: backend
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0 generate
          go test ./...
          go vet ./...

  web-checks:
    name: web-checks
    runs-on: ubuntu-latest
    needs: release-meta
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-meta.outputs.release_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run test

  build-and-push-backend-amd64:
    name: build-and-push-backend-amd64
    runs-on: ubuntu-latest
    needs:
      - release-meta
      - go-checks
      - web-checks
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-meta.outputs.release_sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Login to registry
        run: |
          set -euo pipefail
          REGISTRY_HOST="$(echo "$REGISTRY" | cut -d/ -f1)"
          echo "${{ github.token }}" | docker login "$REGISTRY_HOST" -u "${{ github.actor }}" --password-stdin

      - name: Build and push backend images (amd64)
        uses: docker/bake-action@v6
        env:
          TAG: ${{ needs.release-meta.outputs.release_tag }}-amd64
          PLATFORMS: linux/amd64
          CACHE_SCOPE: images-ubuntu-latest
          CACHE_READONLY: 'true'
        with:
          files: docker-bake.hcl
          targets: backend
          push: true

  build-and-push-web-amd64:
    name: build-and-push-web-amd64
    runs-on: ubuntu-latest
    needs:
      - release-meta
      - go-checks
      - web-checks
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-meta.outputs.release_sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Login to registry
        run: |
          set -euo pipefail
          REGISTRY_HOST="$(echo "$REGISTRY" | cut -d/ -f1)"
          echo "${{ github.token }}" | docker login "$REGISTRY_HOST" -u "${{ github.actor }}" --password-stdin

      - name: Build and push web (amd64)
        uses: docker/bake-action@v6
        env:
          TAG: ${{ needs.release-meta.outputs.release_tag }}-amd64
          PLATFORMS: linux/amd64
          APP_VERSION: ${{ needs.release-meta.outputs.release_tag }}
          GIT_SHA: ${{ needs.release-meta.outputs.release_sha }}
          CACHE_SCOPE: images-ubuntu-latest
          CACHE_READONLY: 'true'
        with:
          files: docker-bake.hcl
          targets: web
          push: true

  # arm64 images are for self-hosters; production and the deploy below use amd64 only.
  # Built without a cache, since CI on main only builds amd64.
  build-and-push-arm64:
    name: build-and-push-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    needs:
      - release-meta
      - go-checks
      - web-checks
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-meta.outputs.release_sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Login to registry
        run: |
          set -euo pipefail
          REGISTRY_HOST="$(echo "$REGISTRY" | cut -d/ -f1)"
          echo "${{ github.token }}" | docker login "$REGISTRY_HOST" -u "${{ github.actor }}" --password-stdin

      - name: Build and push images (arm64)
        uses: docker/bake-action@v6
        env:
          TAG: ${{ needs.release-meta.outputs.release_tag }}-arm64
          PLATFORMS: linux/arm64
          APP_VERSION: ${{ needs.release-meta.outputs.release_tag }}
          GIT_SHA: ${{ needs.release-meta.outputs.release_sha }}
        with:
          files: docker-bake.hcl
          targets: default
          push: true

  # Joins the per-arch images into multi-arch <tag> and latest for self-hosters.
  publish-multiarch:
    name: publish-multiarch
    runs-on: ubuntu-latest
    needs:
      - release-meta
      - build-and-push-backend-amd64
      - build-and-push-web-amd64
      - build-and-push-arm64
    env:
      TAG: ${{ needs.release-meta.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-meta.outputs.release_sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Login to registry
        run: |
          set -euo pipefail
          REGISTRY_HOST="$(echo "$REGISTRY" | cut -d/ -f1)"
          echo "${{ github.token }}" | docker login "$REGISTRY_HOST" -u "${{ github.actor }}" --password-stdin

      - name: Create manifest lists
        run: |
          set -euo pipefail
          # Image names come from the bake file, so new services are picked up automatically.
          for image in $(docker buildx bake -f docker-bake.hcl --print default | jq -r '.target[].tags[]'); do
            tags=(-t "$image")
            # Pre-releases (v1.2.3-rc1) don't move latest.
            if [[ "$TAG" != *-* ]]; then
              tags+=(-t "${image%:*}:latest")
            fi
            docker buildx imagetools create "${tags[@]}" "$image-amd64" "$image-arm64"
          done

  # Deploys: sets the new image tags in the ops repo (apps/geoduels), where Flux picks them up.
  # Rollback: revert that commit.
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment: production
    needs:
      - release-meta
      - build-and-push-backend-amd64
      - build-and-push-web-amd64
    env:
      TAG: ${{ needs.release-meta.outputs.release_tag }}
    steps:
      - name: Checkout ops repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OPS_REPOSITORY }}
          token: ${{ secrets.OPS_REPO_TOKEN }}

      # yq is preinstalled on GitHub's Ubuntu runners.
      - name: Set the image tags
        run: |
          set -euo pipefail
          # The risk engine is released from its own repo.
          yq -i '(.images[] | select(.name != "*-risk-engine") | .newTag) = strenv(TAG) + "-amd64"' \
            apps/geoduels/kustomization.yaml
          git diff --stat

      - name: Commit to ops
        run: |
          set -euo pipefail
          git config user.name "geoduels-release[bot]"
          git config user.email "geoduels-release@users.noreply.github.com"
          git commit -am "deploy geoduels ${TAG}" -m "From ${{ github.repository }}@${{ needs.release-meta.outputs.release_sha }}"
          # Other products release into the same repo; replay on top of theirs.
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
