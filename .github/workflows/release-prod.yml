name: release-prod

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: release-prod
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.REGISTRY != '' && vars.REGISTRY || format('ghcr.io/{0}', github.repository_owner) }}
  OPS_REPOSITORY: ${{ vars.OPS_REPOSITORY != '' && vars.OPS_REPOSITORY || 'sourcelocation/ops' }}

jobs:
  release-meta:
    name: release-meta
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.meta.outputs.release_sha }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          set -euo pipefail
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "release_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

  go-checks:
    name: go-checks
    runs-on: ubuntu-latest
    needs: release-meta
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-meta.outputs.release_sha }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Generate and test Go code
        working-directory: backend
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0 generate
          go test ./...
          go vet ./...

  web-checks:
    name: web-checks
    runs-on: ubuntu-latest
    needs: release-meta
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-meta.outputs.release_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run test

  build-and-push-backend-amd64:
    name: build-and-push-backend-amd64
    runs-on: ubuntu-latest
    needs:
      - release-meta
      - go-checks
      - web-checks
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-meta.outputs.release_sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Login to registry
        run: |
          set -euo pipefail
          REGISTRY_HOST="$(echo "$REGISTRY" | cut -d/ -f1)"
          echo "${{ github.token }}" | docker login "$REGISTRY_HOST" -u "${{ github.actor }}" --password-stdin

      - name: Build and push backend images (amd64)
        uses: docker/bake-action@v6
        env:
          TAG: ${{ needs.release-meta.outputs.release_tag }}-amd64
          PLATFORMS: linux/amd64
          CACHE_SCOPE: images-ubuntu-latest
        with:
          files: docker-bake.hcl
          targets: backend
          push: true

  build-and-push-web-amd64:
    name: build-and-push-web-amd64
    runs-on: ubuntu-latest
    needs:
      - release-meta
      - go-checks
      - web-checks
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-meta.outputs.release_sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Login to registry
        run: |
          set -euo pipefail
          REGISTRY_HOST="$(echo "$REGISTRY" | cut -d/ -f1)"
          echo "${{ github.token }}" | docker login "$REGISTRY_HOST" -u "${{ github.actor }}" --password-stdin

      - name: Build and push web (amd64)
        uses: docker/bake-action@v6
        env:
          TAG: ${{ needs.release-meta.outputs.release_tag }}-amd64
          PLATFORMS: linux/amd64
          APP_VERSION: ${{ needs.release-meta.outputs.release_tag }}
          GIT_SHA: ${{ needs.release-meta.outputs.release_sha }}
          CACHE_SCOPE: images-ubuntu-latest
        with:
          files: docker-bake.hcl
          targets: web
          push: true

  # Deploys: commits the release to the ops repo, where Flux picks it up. The tag pins this repo's
  # k3s/base and the images together (apps/geoduels/release.yaml). Rollback: revert that commit.
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment: production
    needs:
      - release-meta
      - build-and-push-backend-amd64
      - build-and-push-web-amd64
    env:
      TAG: ${{ needs.release-meta.outputs.release_tag }}
    steps:
      - name: Checkout ops repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OPS_REPOSITORY }}
          token: ${{ secrets.OPS_REPO_TOKEN }}

      # yq is preinstalled on GitHub's Ubuntu runners.
      - name: Pin the release
        run: |
          set -euo pipefail
          yq -i '(select(.kind == "GitRepository") | .spec.ref.tag) = strenv(TAG)
               | (select(.kind == "Kustomization") | .spec.images[].newTag) = strenv(TAG) + "-amd64"' \
            apps/geoduels/release.yaml
          yq -i '.data.NEXT_PUBLIC_APP_VERSION = strenv(TAG)' apps/geoduels/production/runtime-config.yaml
          git diff --stat

      - name: Commit to ops
        run: |
          set -euo pipefail
          git config user.name "geoduels-release[bot]"
          git config user.email "geoduels-release@users.noreply.github.com"
          git commit -am "deploy geoduels ${TAG}" -m "From ${{ github.repository }}@${{ needs.release-meta.outputs.release_sha }}"
          # Other products release into the same repo; replay on top of theirs.
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
