name: release-prod

# A release is a pull request from master into production, titled with the version it ships
# (v1.2.3). On the pull request, the amd64 images are built and pushed as candidates
# (<version>-<commit>-amd64), and "Release candidate" passes once all of them exist. Merging it
# promotes the candidates to <version>-amd64, tags the merge commit and deploys through ops; then the
# arm64 and multi-arch images for self-hosters follow. A build that fails blocks the merge, so no
# version is used up by a broken release.
on:
  pull_request:
    branches: [production]
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [production]

permissions:
  contents: read

concurrency:
  # A body-only edit gets a group of its own, so it never cancels a build.
  group: >-
    release-prod-${{ github.event.pull_request.number || 'production' }}${{
    github.event.action == 'edited' && !github.event.changes.title && '-edit' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ${{ vars.REGISTRY != '' && vars.REGISTRY || format('ghcr.io/{0}', github.repository_owner) }}
  OPS_REPOSITORY: ${{ vars.OPS_REPOSITORY != '' && vars.OPS_REPOSITORY || 'sourcelocation/ops' }}

jobs:
  release-meta:
    name: Release version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_sha: ${{ steps.meta.outputs.release_sha }}
      candidate: ${{ steps.meta.outputs.candidate }}
      build: ${{ steps.meta.outputs.build }}
    steps:
      - id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REBUILD: ${{ github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.title != null) }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            pr=$(jq '.pull_request' "$GITHUB_EVENT_PATH")
          else
            pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              --jq "[.[] | select(.base.ref == \"production\" and .merged_at != null)][0]")
          fi
          if [ -z "$pr" ] || [ "$pr" = null ]; then
            echo "::error::production only changes through a release pull request."; exit 1
          fi
          tag=$(jq -r '.title' <<<"$pr")
          sha=$(jq -r '.head.sha' <<<"$pr")
          from=$(jq -r '.head.repo.full_name + ":" + .head.ref' <<<"$pr")
          if [ "$from" != "$GITHUB_REPOSITORY:$DEFAULT_BRANCH" ]; then
            echo "::error::A release comes from $DEFAULT_BRANCH, not $from."; exit 1
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::The title is the version it releases, like v1.2.3, not \"$tag\"."; exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>/dev/null; then
            echo "::error::$tag is released already."; exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # The release builds what master's CI tested: wait for it on this commit. A commit that
            # only touches docs has no CI run.
            for _ in $(seq 1 120); do
              run=$(gh run list --workflow ci.yml --commit "$sha" --event push --limit 1 --json status,conclusion --jq '.[0] // empty')
              [ -z "$run" ] || [ "$(jq -r .status <<<"$run")" = completed ] && break
              sleep 15
            done
            if [ -n "$run" ] && [ "$(jq -r .conclusion <<<"$run")" != success ]; then
              echo "::error::CI didn't pass on master at ${sha:0:7}."; exit 1
            fi
          fi
          {
            echo "release_tag=$tag"
            echo "release_sha=$sha"
            echo "candidate=$tag-${sha:0:7}"
            echo "build=$REBUILD"
          } >> "$GITHUB_OUTPUT"

  build-amd64:
    name: build-amd64
    if: needs.release-meta.outputs.build == 'true'
    needs: release-meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-meta.outputs.release_sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Login to registry
        run: |
          set -euo pipefail
          REGISTRY_HOST="$(echo "$REGISTRY" | cut -d/ -f1)"
          echo "${{ github.token }}" | docker login "$REGISTRY_HOST" -u "${{ github.actor }}" --password-stdin

      - name: Build and push the candidates (amd64)
        uses: docker/bake-action@v6
        env:
          TAG: ${{ needs.release-meta.outputs.candidate }}-amd64
          PLATFORMS: linux/amd64
          APP_VERSION: ${{ needs.release-meta.outputs.release_tag }}
          GIT_SHA: ${{ needs.release-meta.outputs.release_sha }}
          CACHE: write
        with:
          files: docker-bake.hcl
          targets: default
          push: true

  candidate:
    name: Release candidate
    if: always() && github.event_name == 'pull_request'
    needs: [release-meta, build-amd64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-meta.outputs.release_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Login to registry
        run: |
          set -euo pipefail
          REGISTRY_HOST="$(echo "$REGISTRY" | cut -d/ -f1)"
          echo "${{ github.token }}" | docker login "$REGISTRY_HOST" -u "${{ github.actor }}" --password-stdin

      # Passes once every candidate image exists: built by this run, or, after a body-only edit, by
      # the run still building them.
      - name: Every candidate image exists
        env:
          META_RESULT: ${{ needs.release-meta.result }}
          BUILD_RESULT: ${{ needs.build-amd64.result }}
          TAG: ${{ needs.release-meta.outputs.candidate }}-amd64
        run: |
          set -euo pipefail
          [ "$META_RESULT" = success ] || { echo "::error::The release version isn't valid."; exit 1; }
          [ "$BUILD_RESULT" = success ] || [ "$BUILD_RESULT" = skipped ] || { echo "::error::An image failed to build."; exit 1; }
          for image in $(docker buildx bake -f docker-bake.hcl --print default | jq -r '.target[].tags[]'); do
            for _ in $(seq 1 60); do docker buildx imagetools inspect "$image" >/dev/null 2>&1 && continue 2; sleep 15; done
            echo "::error::$image doesn't exist."; exit 1
          done

  # The candidates become the release, and the merge commit is tagged.
  promote:
    name: promote
    if: github.event_name == 'push'
    needs: release-meta
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to registry
        run: |
          set -euo pipefail
          REGISTRY_HOST="$(echo "$REGISTRY" | cut -d/ -f1)"
          echo "${{ github.token }}" | docker login "$REGISTRY_HOST" -u "${{ github.actor }}" --password-stdin

      - name: Promote the candidates
        env:
          TAG: ${{ needs.release-meta.outputs.candidate }}-amd64
          RELEASE_TAG: ${{ needs.release-meta.outputs.release_tag }}-amd64
        run: |
          set -euo pipefail
          for image in $(docker buildx bake -f docker-bake.hcl --print default | jq -r '.target[].tags[]'); do
            docker buildx imagetools create -t "${image%:*}:$RELEASE_TAG" "$image"
          done

      - name: Tag the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-meta.outputs.release_tag }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" --silent

  # Deploys: sets the new image tags in the ops repo (apps/geoduels), where Flux picks them up.
  # Rollback: revert that commit.
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment: production
    needs:
      - release-meta
      - promote
    env:
      TAG: ${{ needs.release-meta.outputs.release_tag }}
    steps:
      - name: Checkout ops repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OPS_REPOSITORY }}
          token: ${{ secrets.OPS_REPO_TOKEN }}

      # yq is preinstalled on GitHub's Ubuntu runners.
      - name: Set the image tags
        run: |
          set -euo pipefail
          # The risk engine is released from its own repo.
          yq -i '(.images[] | select(.name != "*-risk-engine") | .newTag) = strenv(TAG) + "-amd64"' \
            apps/geoduels/kustomization.yaml
          git diff --stat

      - name: Commit to ops
        run: |
          set -euo pipefail
          git config user.name "geoduels-release[bot]"
          git config user.email "geoduels-release@users.noreply.github.com"
          git commit -am "deploy geoduels ${TAG}" -m "From ${{ github.repository }}@${{ needs.release-meta.outputs.release_sha }}"
          # Other products release into the same repo; replay on top of theirs.
          for _ in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1

  # arm64 images are for self-hosters; production and the deploy above use amd64 only.
  # Built after the release, without a cache: they don't hold up the merge.
  build-and-push-arm64:
    name: build-and-push-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    needs:
      - release-meta
      - promote
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to registry
        run: |
          set -euo pipefail
          REGISTRY_HOST="$(echo "$REGISTRY" | cut -d/ -f1)"
          echo "${{ github.token }}" | docker login "$REGISTRY_HOST" -u "${{ github.actor }}" --password-stdin

      - name: Build and push images (arm64)
        uses: docker/bake-action@v6
        env:
          TAG: ${{ needs.release-meta.outputs.release_tag }}-arm64
          PLATFORMS: linux/arm64
          APP_VERSION: ${{ needs.release-meta.outputs.release_tag }}
          GIT_SHA: ${{ needs.release-meta.outputs.release_sha }}
        with:
          files: docker-bake.hcl
          targets: default
          push: true

  # Joins the per-arch images into multi-arch <tag> and latest for self-hosters.
  publish-multiarch:
    name: publish-multiarch
    runs-on: ubuntu-latest
    needs:
      - release-meta
      - build-and-push-arm64
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ needs.release-meta.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to registry
        run: |
          set -euo pipefail
          REGISTRY_HOST="$(echo "$REGISTRY" | cut -d/ -f1)"
          echo "${{ github.token }}" | docker login "$REGISTRY_HOST" -u "${{ github.actor }}" --password-stdin

      - name: Create manifest lists
        run: |
          set -euo pipefail
          # Image names come from the bake file, so new services are picked up automatically.
          for image in $(docker buildx bake -f docker-bake.hcl --print default | jq -r '.target[].tags[]'); do
            tags=(-t "$image")
            # Pre-releases (v1.2.3-rc1) don't move latest.
            if [[ "$TAG" != *-* ]]; then
              tags+=(-t "${image%:*}:latest")
            fi
            docker buildx imagetools create "${tags[@]}" "$image-amd64" "$image-arm64"
          done
