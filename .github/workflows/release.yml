name: Release

on:
  push:
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # Not GITHUB_TOKEN: GitHub starts no CI for pull requests it opens.
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.token.outputs.token }}

  images:
    name: Images (${{ matrix.arch }})
    if: needs.release-please.outputs.created == 'true'
    needs: release-please
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          TAG: ${{ needs.release-please.outputs.tag }}-${{ matrix.arch }}
          VERSION: ${{ needs.release-please.outputs.tag }}
          ARCH: ${{ matrix.arch }}
          CACHE: write
          REVISION: ${{ needs.release-please.outputs.sha }}
        with:
          source: .
          files: docker-bake.hcl
          push: true
          provenance: mode=max
          sbom: true
          # The source label links each package to this repository, whose registry_package
          # webhook tells ops' Flux to deploy it.
          set: |
            *.labels.org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            *.labels.org.opencontainers.image.version=${{ needs.release-please.outputs.tag }}
            *.labels.org.opencontainers.image.revision=${{ needs.release-please.outputs.sha }}

  publish:
    name: Publish
    needs: [release-please, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Join the architectures under the version's tag
        run: |
          set -euo pipefail
          for image in $(docker buildx bake --file docker-bake.hcl --print | jq -r '.target[].tags[] | sub(":dev$"; "")'); do
            docker buildx imagetools create -t "$image:$TAG" "$image:$TAG-amd64" "$image:$TAG-arm64"
          done
      # The drafted release goes public only once its images exist.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
