name: Release

on:
  push:
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: sourcelocation/.github/.github/workflows/release.yml@4ac8064e28fb1fe1d2aef547ac38b217da4db715 # master
    with:
      platforms: '["linux/amd64", "linux/arm64"]'
    permissions:
      contents: write
      pull-requests: write
      issues: write
      packages: write
    secrets: inherit
