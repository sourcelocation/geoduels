name: Release

on:
  push:
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: sourcelocation/.github/.github/workflows/release.yml@main
    with:
      app: geoduels
      bake: true
      platforms: '["linux/amd64", "linux/arm64"]'
      latest: true
    permissions:
      contents: write
      pull-requests: write
      issues: write
      packages: write
    secrets: inherit
