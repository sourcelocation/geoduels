# Self-hosted production-style stack for the beta server (no k3s/Flux).
# All services bind to the host loopback only; nginx (NPM) on the same host is
# the single public entrypoint. Run with:
#   docker compose --env-file backend/beta.secrets.env \
#     -f backend/selfhosted.yaml up -d
# Images default to the latest release (amd64 and arm64); pin IMAGE_TAG to a
# release such as v2.2.4 to stay on it.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    init: true
    stop_grace_period: 5s
    command:
      - postgres
      - -c
      - log_statement=none
      - -c
      - log_min_error_statement=fatal
      - -c
      - log_min_messages=warning
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  gameplay-node:
    image: ${REGISTRY:-ghcr.io/sourcelocation}/geoduels-gameplay-node:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    stop_grace_period: 5m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    environment:
      GAMEPLAY_NODE_ADDR: :8091
      GAMEPLAY_NODE_ID: game-1
      GAMEPLAY_INTERNAL_URL: http://gameplay-node:8091
      POSTGRES_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      COORDINATOR_INTERNAL_SECRET: ${COORDINATOR_INTERNAL_SECRET}
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  api:
    image: ${REGISTRY:-ghcr.io/sourcelocation}/geoduels-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    stop_grace_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    environment:
      POSTGRES_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      APP_AUTH_SECRET: ${APP_AUTH_SECRET}
      COORDINATOR_INTERNAL_SECRET: ${COORDINATOR_INTERNAL_SECRET}
      APP_ACCESS_TOKEN_TTL: ${APP_ACCESS_TOKEN_TTL:-15m}
      APP_REFRESH_TOKEN_TTL: ${APP_REFRESH_TOKEN_TTL:-720h}
      GUEST_SIGNUP_IP_LIMIT: ${GUEST_SIGNUP_IP_LIMIT:-5}
      GUEST_SIGNUP_IP_WINDOW: ${GUEST_SIGNUP_IP_WINDOW:-10m}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      ADMIN_BOOTSTRAP_EMAILS: ${ADMIN_BOOTSTRAP_EMAILS}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_ISSUER: ${GOOGLE_ISSUER:-https://accounts.google.com}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      STRIPE_MODE: ${STRIPE_MODE:-test}
      STRIPE_TEST_PAYMENT_LINK_URL: ${STRIPE_TEST_PAYMENT_LINK_URL:-}
      STRIPE_TEST_WEBHOOK_SECRET: ${STRIPE_TEST_WEBHOOK_SECRET:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      gameplay-node:
        condition: service_started
      db-migrate:
        condition: service_completed_successfully

  web:
    image: ${REGISTRY:-ghcr.io/sourcelocation}/geoduels-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    stop_grace_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    environment:
      PORT: "3000"
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      NEXT_PUBLIC_GOOGLE_ALLOWED_ORIGINS: ${NEXT_PUBLIC_GOOGLE_ALLOWED_ORIGINS}
      NEXT_PUBLIC_DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      NEXT_PUBLIC_APP_VERSION: ${IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

  moderation-worker:
    image: ${REGISTRY:-ghcr.io/sourcelocation}/geoduels-moderation-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    stop_grace_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    environment:
      MODERATION_WORKER_ADDR: :8093
      POSTGRES_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      RISK_ENGINE_URL: ${RISK_ENGINE_URL:-}
      RISK_ENGINE_TOKEN: ${RISK_ENGINE_TOKEN:-}
    ports:
      - "127.0.0.1:8093:8093"
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  discord-worker:
    image: ${REGISTRY:-ghcr.io/sourcelocation}/geoduels-discord-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    stop_grace_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    environment:
      DISCORD_WORKER_ADDR: :8094
      POSTGRES_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
    ports:
      - "127.0.0.1:8094:8094"
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  # Brings the schema to this release (goose, then River) before anything that uses the database
  # starts. A blank database gets the v2 baseline (version 2000) and every later migration.
  db-migrate:
    image: ${REGISTRY:-ghcr.io/sourcelocation}/geoduels-api:${IMAGE_TAG:-latest}
    entrypoint: ["/migrate"]
    environment:
      POSTGRES_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
