version: "2"
sql:
  # Single sqlc module for the whole store layer: one file per domain under
  # db/queries, regenerated in bulk. Directory paths are not walked by sqlc,
  # so the flat glob is explicit.
  - engine: postgresql
    queries: "db/queries/*.sql"
    schema: db/migrations
    gen:
      go:
        package: db
        out: pkg/persistence/sqlc/db
        sql_package: pgx/v5
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
