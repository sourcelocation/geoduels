version: "2"
sql:
  - engine: postgresql
    queries: db/queries/controlplane
    # Query packages consume a reviewed current-schema projection instead of
    # historical migrations. Some migrations intentionally inspect pg_catalog,
    # which is valid at migration time but not parseable by sqlc.
    schema: db/schema/controlplane.sql
    gen:
      go:
        package: controlplanequeries
        out: pkg/persistence/sqlc/controlplane
        sql_package: pgx/v5
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
